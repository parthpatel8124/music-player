<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>music player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: cursive;
        }

        .main {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            /* background-color: #72c95b; */
            background-image: url("/img/musicbg.png");
        }

        .container {
            position: relative;
            height: 35rem;
            width: 20rem;
            background-color: #fff;
            padding: 2.5rem;
            border-radius: 2rem;
            box-shadow: 0px 2px 10px 4px rgba(0, 0, 0, 0.3);
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .content {
            position: relative;
            bottom: 15px;
        }

        #titlee {
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            word-spacing: 0.3rem;
            font-size: 1.5rem;
            font-weight: 500;
            text-shadow: 0 0.1rem 0.3rem rgba(0, 0, 0, 0.3);
            color: #1e1d1d;
            margin-top: 5px;

        }

        #artist {
            text-transform: capitalize;
            letter-spacing: 0.1rem;
            word-spacing: 0.3rem;
            font-size: 1rem;
            font-weight: 300;
            color: rgb(60, 60, 60);
            /* margin-top: 5px; */
            margin-bottom: 1rem;
        }

        .img {
            position: relative;
            top: -15px;
            height: 16rem;
            width: 16rem;
            /* background-color: #b23838; */
            margin: auto;
            /* display: flex;
            justify-content:space-evenly;
            align-items: center; */

        }

        .img::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 40px;
            width: 40px;
            border-radius: 50%;
            background-color: #d1d1d1;

        }

        img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            box-shadow: 0px 2px 20px 8px rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            transition: 1s;
            /* position: relative;
            right: 20px; */

        }

        .song-slider {
            width: 100%;
            position: relative;
        }

        .seek_bar {
            -webkit-appearance: none;
            width: 100%;
            height: 10px;
            border-radius: 10px;
            background-color: #aeaeae;
            cursor: pointer;
            overflow: hidden;
            /* transition: width 1s; */

        }

        .seek_bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 20px;
            /* background:#9e2020; */
            box-shadow: -400px 0 0 400px rgb(84, 84, 84);

        }

        .timee {
            font-size: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            position: relative;
            /* top:0px; */
            bottom: 8px;

        }




        .controls {
            position: relative;
            width: 80%;
            display: flex;
            justify-content: space-between;
            align-items: center;

        }

        .controls .fa-solid {
            font-size: 1.5rem;
            cursor: pointer;
            filter: drop-shadow(0px 2px 20px 8px rgba(0, 0, 0, 0.3));

        }

        .controls .fa-solid:hover {
            color: #6d6d6d;
        }

        .controls .playbtn {
            height: 40px;
            width: 40px;
            border-radius: 50%;
            font-size: 1rem;
            color: #fff;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .controls .playbtn:hover {
            background-color: #656565;
            color: #ffffff;

        }

        .anime {
            animation: rotateplayer 6s linear infinite;
        }

        @keyframes rotateplayer {
            from {
                transform: rotate(0deg);

            }

            to {
                transform: rotate(360deg);


            }

        }

        .like {
            font-size: 1.4rem;
            transition: 1s;
            color: #ff000049;

            /* color:red; */
        }

        .red-like {

            color: rgb(255, 0, 0);



        }


        /* Modify the appearance of the slider */


        .volume_slider {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            height: 5px;
            background: rgb(115, 115, 115);
            opacity: 0.7;
            -webkit-transition: 0.2s;
            transition: opacity 0.2s;

        }

        /* Modify the appearance of the slider thumb */

        .volume_slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            background: rgb(86, 85, 85);
            cursor: pointer;
            border-radius: 50%;
        }

        /* Change the opacity when mouse is hovered */

        .volume_slider:hover {
            opacity: 1.0;
        }

        .volume_slider {
            width: 70%;
        }

        .volumebtn {
            position: relative;
            top: 10px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="container" id="container">
            <div class="content">
                <h2 id="titlee">soni soni</h2>
                <h3 id="artist">darshan raval</h3>
            </div>
            <div class="img" id="img">
                <img src="./img/parth1.jpg" alt="">

            </div>
            <div class="like" id="like">
                <!-- <i class="fa-solid fa-heart" style="color: #ff0000;"></i> -->
                <i class="fa-solid fa-heart"></i>
                <!-- <i class="fa-regular fa-heart"></i> -->
            </div>
            <div class="song-slider">
                <input type="range" value="0" class="seek_bar">
            </div>
            <div class="timee">
                <span id="current_time">0:00</span>
                <span id="song_duration">3:13</span>
            </div>

            <audio src="./img/parth1.mp3"></audio>

            <div class="controls">
                <i class="fa-solid fa-backward" id="prev"></i>
                <i class="fa-solid fa-play playbtn" id="play"></i>
                <i class="fa-solid fa-forward" id="next"></i>

            </div>

            <!-- Define the section for displaying the volume slider-->
            <div class="volumebtn">
                <i class="fa fa-volume-down"></i>
                <input type="range" min="1" max="100" value="55" class="volume_slider" onchange="setVolume()">
                <i class="fa fa-volume-up"></i>
            </div>



        </div>
    </div>
    </div>

    <script>
        const music = document.querySelector("audio");
        const cover = document.getElementById('img');
        const img = document.querySelector("img");
        const seek_bar = document.querySelector('.seek_bar');
        const play = document.getElementById("play");
        const next = document.getElementById("next");
        const prev = document.getElementById("prev");
        const like = document.getElementById("like");
        const titlee = document.getElementById("titlee");
        const artist = document.getElementById("artist");
        let current_time = document.getElementById("current_time");
        let song_duration = document.getElementById("song_duration");

        let volume_slider = document.querySelector(".volume_slider");

        const songs = [
            {
                name: "parth1",
                titlee: "soni soni",
                artist: "darshan raval",

            },
            {
                name: "parth2",
                titlee: "ordinaryperson",
                artist: "pagal word",

            },
            {
                name: "parth3",
                titlee: "jab tak",
                artist: "armaan malik",

            }
        ];
        // like class change  
        like.addEventListener('click', () => {
            // like.classList.remove("fa-regular");
            // like.classList.remove("fa-heart");

            // like.classList.add("red-like");
            like.classList.toggle("red-like");
            // like.classList.add("fa-solid");
            // like.classList.add("fa-heart");

        })

        function setVolume() {
            // Set the volume according to the
            // percentage of the volume slider set
            music.volume = volume_slider.value / 100;
        }




        // random color generater 
        // random_bg_color();
        let container = document.getElementById("container");
        function random_bg_color() {
            // Get a random number between 64 to 256
            // (for getting lighter colors)
            let red = Math.floor(Math.random() * 256) + 64;
            let green = Math.floor(Math.random() * 256) + 64;
            let blue = Math.floor(Math.random() * 256) + 64;

            // Construct a color with the given values
            let bgColor = "rgb(" + red + ", " + green + ", " + blue + ")";

            // Set the background to the new color
            // container.style.backgroundColor = bgColor ;
            document.body.style.background = bgColor;



        }
        // random_bg_color();


        // Set max value when you know the duration
        music.onloadedmetadata = () => seek_bar.max = music.duration;
        // update audio position
        seek_bar.onchange = () => music.currentTime = seek_bar.value;
        // update range input when currentTime updates
        music.ontimeupdate = () => seek_bar.value = music.currentTime;

        let isplaying = false;

        const playmusic = () => {
            isplaying = true;
            music.play();
            play.classList.replace("fa-play", "fa-pause");
            // img.classList.add("anime");
            cover.classList.add("anime");


        };
        // for pause function
        const pausemusic = () => {
            isplaying = false;
            music.pause();
            play.classList.replace("fa-pause", "fa-play");
            img.classList.remove("anime");
            cover.classList.remove("anime");

        };

        play.addEventListener("click", () => {


            isplaying ? pausemusic() : playmusic();
        });

        let loadsong = (songs) => {
            titlee.textContent = songs.titlee;
            artist.textContent = songs.artist;
            music.src = "./img/" + songs.name + ".mp3";
            img.src = "./img/" + songs.name + ".jpg";


        }

        // loadsong(songs[2]);
        songindex = 0;
        const nextsong = () => {
            songindex = (songindex + 1) % songs.length;
            loadsong(songs[songindex]);
            playmusic();
            like.classList.remove("red-like");
            // random_bg_color();



        };
        const prevsong = () => {
            songindex = (songindex - 1 + songs.length) % songs.length;
            loadsong(songs[songindex]);
            playmusic();
            like.classList.remove("red-like");
            // random_bg_color();


        };
        music.addEventListener("timeupdate", (event) => {
            const { currentTime, duration } = event.srcElement;

            //music  duration update
            let min_duration = Math.floor(duration / 60);
            let sec_duration = Math.floor(duration % 60);
            let tot_duration = `${min_duration}:${sec_duration}`;
            if (duration) {
                song_duration.textContent = `${tot_duration}`;
            }

            //current duration update
            let min_currentTime = Math.floor(currentTime / 60);
            let sec_currentTime = Math.floor(currentTime % 60);
            if (sec_currentTime < 10) {
                sec_currentTime = `0${sec_currentTime}`;

            }
            let tot_currentTime = `${min_currentTime}:${sec_currentTime}`;
            current_time.textContent = `${tot_currentTime}`;






        });

        // function savedata() {
        //     localStorage.setItem("data", like);
        // }

        // function showtask() {
        //     like = localStorage.getItem("data");

        // }
        // showtask();

        music.addEventListener('ended', nextsong);
        next.addEventListener("click", nextsong);
        prev.addEventListener("click", prevsong);


    </script>

</body>

</html>
